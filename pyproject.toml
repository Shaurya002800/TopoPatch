[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "topopatch"
version = "0.1.0"
description = "Reproducible selective vector migration research prototype"
requires-python = ">=3.11"
[project.scripts]
topopatch = "topopatch.__main__:main"
[tool.setuptools.packages.find]
include = ["topopatch*"]

[tool.setuptools.package-data]
topopatch = ["web/*.html", "web/*.css", "web/*.js"]
